name: 'Run resqui'
description: 'Installs resqui and runs it to assess research software quality indicators.'
inputs:
  config:
    description: 'Path to the configuration file (e.g., configurations/basic.json)'
    required: false
  github_token:
    description: 'GitHub token required for some indicator plugins.'
    required: true
  dashverse_token:
    description: 'Dashverse token to upload the results'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install resqui
      run: |
        python -m pip install --upgrade pip
        pip install git+https://github.com/EVERSE-ResearchSoftware/QualityPipelines.git@main
      shell: bash

    - name: Run resqui
      shell: bash
      env:
        RESQUI_GITHUB_TOKEN: ${{ inputs.github_token }}
        RESQUI_CONFIG: ${{ inputs.config }}
        DASHVERSE_TOKEN: ${{ inputs.dashverse_token }}
      run: |
        RESQUI_ARGS="-t $RESQUI_GITHUB_TOKEN"
        if [[ -n "$RESQUI_CONFIG" ]]; then
          RESQUI_ARGS="$RESQUI_ARGS -c $RESQUI_CONFIG"
        fi
        if [[ -n "$DASHVERSE_TOKEN" ]]; then
          RESQUI_ARGS="$RESQUI_ARGS -d $DASHVERSE_TOKEN"
        fi
        resqui $RESQUI_ARGS
